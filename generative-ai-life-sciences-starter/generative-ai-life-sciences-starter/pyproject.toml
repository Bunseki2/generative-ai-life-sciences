[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-ai-life-sciences"
version = "0.1.0"
description = "A practical learning and portfolio project for deep learning and generative AI in life sciences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.15",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
